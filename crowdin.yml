files:
  # Both paths are relative to the repository, and deliberately have no leading slash: with
  # one, the download writes to that path from the filesystem root instead of from the
  # checkout, so the files land outside the working tree and git has no change to commit.
  - source: manager/src/main/res/values/strings.xml
    translation: manager/src/main/res/values-%android_code%/%original_file_name%

    # This is where the app's languages are decided, for the 43 of the project's target
    # languages that this app carries. Crowdin's targets are regional locales - Japanese is `ja` with the Android
    # code `ja-rJP`, Russian is `ru` and its Belarus variant `ru-BY`, Turkish is `tr` and its
    # Cyprus variant `tr-CY`, Indonesian's code is the legacy `in-rID`, German is `de-BE` - so
    # Android's own placeholder would write values-ja-rJP, values-ru-rRU, values-tr-rTR and
    # values-de-rBY.
    # Each is named here instead, which is what makes the export land in the folder this app
    # ships. The format is Crowdin's language code: the code the placeholder should produce.
    #
    # Adding a language is two edits here and a pull request merged by hand, because the check
    # that guards this branch refuses any file whose folder does not exist yet: a language
    # should appear in the app because someone decided it should, never because an export
    # brought it along.
    languages_mapping:
      android_code:
        af: af
        ar-EG: ar
        az: az
        bn: bn
        cs: cs
        de-BE: de
        el-CY: el
        es-419: es
        fa-AF: fa
        fi: fi
        fil: fil
        fr-LU: fr
        hi: hi
        hu: hu
        hy-AM: hy
        id: id
        it-CH: it
        ja: ja
        ka: ka
        ko: ko
        mr: mr
        ms-BN: ms
        nl-SR: nl
        # Quoted because a bare `no` is the boolean false to some YAML parsers. Crowdin's own
        # reads it as the language it is - values-no has been written correctly for as long as
        # this mapping has existed - but nothing gains from leaving that to be checked.
        "no": "no"
        pa-IN: pa
        pl: pl
        pt-BR: pt-rBR
        ro: ro
        # The app's Russian ships as `values-ru` and is translated in the project's plain `ru`
        # target, which Crowdin's own Android code would name `ru-rRU`. The Belarus variant is
        # kept as its own folder rather than being allowed to write over the bulk of the
        # language: it was values-ru that the `ru-BY` target used to land in, and the two
        # targets hold different translations of the same strings.
        ru: ru
        ru-BY: ru-rBY
        sl: sl
        sr-Cyrl-ME: sr
        sv-FI: sv
        ta: ta
        te: te
        th: th
        # Same shape as the Russian pair above: the app's Turkish ships as `values-tr` and is
        # translated in the project's plain `tr` target, and the Cyprus variant is kept as its
        # own folder instead of being allowed to write over the bulk of the language. It was
        # values-tr that `tr-CY` used to land in, and the two targets hold different
        # translations of the same strings.
        tr: tr
        tr-CY: tr-rCY
        uk: uk
        ur-IN: ur
        vi: vi
        # These two were not target languages at all until the app's Chinese folders were
        # seeded into them: Crowdin's own Android codes for them happen to be zh-rCN and
        # zh-rTW, the names this app uses, but naming them here keeps every language in one
        # list rather than leaving two to be found by chance.
        zh-CN: zh-rCN
        zh-TW: zh-rTW

    # Every target language the project has that is not mapped above, so that none of them can
    # write a folder this app does not carry.
    #
    # An unmapped target does not arrive without its own name: Crowdin falls back to Android's
    # own placeholder for it, which writes values-bn-rIN, values-es-rES, values-hi-rIN and so on
    # - folders the app has never heard of. The check that guards the translation pull requests
    # refuses those, which is the point of it, but the refusal is a nightly red run and a pull
    # request nobody can merge rather than a signal anybody reads. So they are held back here
    # instead: their translations stay in Crowdin, and the export only ever writes the folders
    # named above.
    #
    # Keeping the list in step with the mapping above and the project's own languages is manual,
    # because there is nothing that compares them: adding a target in Crowdin is otherwise
    # enough to start this happening again.
    #
    # Five are left, and none of them is a language this app is missing. Three are the same
    # language arriving twice - `ru-MD` against the `ru` this app ships as values-ru, `es-ES`
    # and `es-US` against `es-419` - and because an unmapped target falls back to Android's
    # placeholder, opening one of those would put two project languages on one folder and let
    # the last export win. `bn-IN` is Bengali a second time beside the `bn` now mapped above,
    # and `en-IN` is English, which is the source.
    #
    # `ru` and `tr` used to be held back here, and holding them back is what issues #31 and #25
    # were: the app's Russian and Turkish ship from values-ru and values-tr, the bulk of each
    # translation was made in that language's regional target (`ru-BY`, `tr-CY`), and the plain
    # target - the one a speaker of the language opens on Crowdin - was excluded from this file
    # and therefore had nothing to translate. Both are now the targets that fill those folders,
    # seeded from the translations already in the repository.
    #
    # Note that removing a language from this list does not by itself make it translatable:
    # the CLI also wrote the list onto the file in Crowdin when it uploaded it, and only the
    # API clears it there - see docs/translations.md.
    excluded_target_languages:
      - bn-IN
      - en-IN
      - es-ES
      - es-US
      - ru-MD

    translate_attributes: 0
    content_segmentation: 0
