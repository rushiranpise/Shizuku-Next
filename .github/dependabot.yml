version: 2

# Every action in .github/workflows is pinned to a commit rather than a tag, because a moving tag
# is one push by somebody else away from running in this repository with a token that can write
# issues. Pinning has one cost - a pin stays where it was put - and this is what pays it: a pull
# request a week with the pins moved on, and the version beside each pin is what it moved to.
#
# Only the workflows. A dependency bump for the build arrives as a pull request that has to pass
# the build regardless, and those are rare enough to do by hand.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      # ci, because a bump is not something a user needs to read about.
      prefix: ci
