name: Labels

# .github/labels.yml is where the label set, its colours and its descriptions are written down,
# and this puts it on the repository.
#
# The workflows that name a label are the reason it exists: the stale mark, the duplicate
# suggestion and the labels the form rules apply all have to exist before the first issue that
# needs them, and a label somebody made in the web UI is one nobody can find again.
#
# The weekly run is not for the file - a push to it is what changes the set. It is for labels
# edited or deleted on GitHub, which this puts back. Deleting stays off, so a label that is not
# in the file, GitHub's own or one made on a whim, is left where it is.
on:
  push:
    branches: [master]
    paths:
      - .github/labels.yml
      - .github/workflows/labels-sync.yml
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  labels:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: crazy-max/ghaction-github-labeler@548a7c3603594ec17c819e1239f281a3b801ab4d # v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
