name: Stale

# Marks issues that nothing has happened to in three months, and closes nothing at all.
#
# The point of a stale mark is to be able to see what nobody has answered; the point of not
# closing is that a report sitting open is still the only record of it, which this repository
# has found the hard way - issue #35 was a real bug that had sat untouched. Every close is
# therefore -1, for issues and for pull requests alike, so no run of this can close anything,
# and a comment takes the mark off again on its own.
#
# Pull requests are left entirely alone: a quiet branch says something different from a quiet
# report, and the build workflow is where that belongs.
on:
  schedule:
    # Weekly, and at an hour nothing else here uses.
    - cron: '23 3 * * 1'
  workflow_dispatch:

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write

    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-issue-stale: 90
          days-before-issue-close: -1
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: stale
          # The two labels that mean somebody has already decided this one is worth keeping.
          exempt-issue-labels: 'pinned,confirmed'
          stale-issue-message: >-
            Nothing has happened on this for ninety days, so it is marked stale. It stays open -
            nothing in this repository closes itself - and a comment here, or taking the label
            off, is enough to clear the mark.
