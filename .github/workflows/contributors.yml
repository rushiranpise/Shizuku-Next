name: Contributors

# The credits wall is drawn from a snapshot of this repository's own history, and the app fetches
# that snapshot from the contributors-data branch. So the wall keeps up with the repository without
# anybody cutting a release, which is the point: contributors keep arriving, and a list baked into
# an APK would be a list of whoever had arrived by the last release.
#
# The branch rather than a release asset or a gist: it needs no extra setup, raw.githubusercontent
# serves it directly, and the file's own history is the record of how the credits changed.
#
# This never touches master. The snapshot is generated data, and a commit for it on every run would
# be noise; the app reads it from the branch and falls back to the copy shipped in the APK.
on:
  schedule:
    # Weekly. Commits are not urgent, and neither is a credits list.
    - cron: '41 4 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - ci/update-contributors.py
      - .github/workflows/contributors.yml

permissions:
  contents: write

concurrency:
  group: contributors
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The credits are read off the whole history, so a shallow clone would only ever see the
          # commits since the last tag.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Generate the snapshot
        env:
          # Used to resolve which GitHub account each commit email belongs to.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python ci/update-contributors.py --out "$RUNNER_TEMP/contributors.json"

      - name: Publish to the data branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Continue the branch if it is there, and start it if it is not - no force push, because
          # the history is worth keeping even for a generated file.
          if git fetch --depth 1 origin contributors-data; then
            git checkout -B contributors-data FETCH_HEAD
          else
            git checkout --orphan contributors-data
          fi

          # The branch carries the snapshot and nothing else.
          git rm -r --quiet --ignore-unmatch . || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp "$RUNNER_TEMP/contributors.json" contributors.json
          git add contributors.json

          if git diff --cached --quiet; then
            echo "Contributors are unchanged; nothing to publish."
            exit 0
          fi

          git commit -m "chore(contributors): refresh the snapshot"
          git push origin contributors-data
