name: Duplicate suggestions

# Suggests existing issues when the title of a new one looks like theirs. Deliberately dull: it
# compares the significant words of two titles and speaks only when two or more of them are
# shared, so it stays quiet when it is not sure. Nothing is closed, nothing is labelled without
# the label existing, and a wrong guess costs one comment that says it may be wrong.
#
# Titles rather than bodies, because there is no model here and there is not going to be one:
# this runs on the token every workflow already has. For the reports this fork actually gets,
# the title is where the shared part is anyway - the same failing step, on the same version.
on:
  issues:
    types: [opened]

jobs:
  suggest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            // Words that show up in so many titles that sharing one says nothing about whether
            // two reports are the same. Compared lower case, after punctuation is stripped.
            const STOP = new Set([
              'about', 'after', 'again', 'against', 'android', 'another', 'because', 'cannot',
              'does', 'doesnt', 'error', 'even', 'from', 'have', 'issue', 'latest', 'maybe',
              'more', 'only', 'other', 'phone', 'please', 'problem', 'same', 'should',
              'shizuku', 'still', 'that', 'their', 'there', 'these', 'they', 'this', 'those',
              'through', 'time', 'under', 'using', 'version', 'when', 'where', 'which',
              'while', 'with', 'without', 'would', 'your',
            ]);

            const words = (text) =>
              String(text || '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .split(' ')
                .filter((word) => word.length >= 4 && !STOP.has(word));

            const { owner, repo } = context.repo;
            const issue = context.payload.issue;

            // A bot reporting a bug does not need help finding itself.
            if (!issue || issue.user?.type === 'Bot') return;

            const mine = words(issue.title);
            if (mine.length < 2) {
              core.info('Nothing distinctive enough in the title to compare');
              return;
            }

            // One comment per issue, ever. The marker is an invisible HTML comment, and this is
            // what keeps an edit or a re-run from saying the same thing a second time.
            const marker = '<!-- possible-duplicate -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: issue.number,
              per_page: 100,
            });
            if (comments.some((comment) => (comment.body || '').includes(marker))) return;

            // The hundred most recent issues, open and closed: an old report is the likeliest
            // place for the same thing to have been said already.
            const { data: recent } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'all',
              sort: 'created',
              direction: 'desc',
              per_page: 100,
            });

            const matches = recent
              .filter((other) => !other.pull_request && other.number !== issue.number)
              .map((other) => {
                const theirs = new Set(words(other.title));
                const shared = mine.filter((word) => theirs.has(word));
                const union = new Set([...mine, ...theirs]);
                return {
                  other,
                  shared: shared.length,
                  // Jaccard: words in common over words in either, so a long vague title
                  // cannot match everything by containing a lot.
                  score: union.size === 0 ? 0 : shared.length / union.size,
                };
              })
              .filter((match) => match.shared >= 2 && match.score >= 0.34)
              .sort((a, b) => b.score - a.score)
              .slice(0, 3);

            if (matches.length === 0) {
              core.info('No similar titles among the last hundred issues');
              return;
            }

            const body = [
              marker,
              matches.length === 1 ? '### Possible duplicate' : '### Possible duplicates',
              '',
              ...matches.map((match) => `- #${match.other.number} — ${match.other.title}`),
              '',
              'This is a comparison of titles and nothing else, so it is wrong as often as it is ' +
                'right. If one of these is the same problem, adding your details there helps more ' +
                'than a second report does; if it is not, ignore this.',
            ].join('\n');

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body,
            });

            try {
              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: ['possible-duplicate'],
              });
            } catch (error) {
              // The label is created by the labels workflow, which may not have run yet on a
              // fresh fork: the comment is the part that matters, so that is not a failure.
              core.info(`Could not add possible-duplicate: ${error.message}`);
            }
