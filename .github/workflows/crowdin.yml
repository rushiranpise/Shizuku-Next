name: Translations

# Two halves of one job, and they run on different days, because they answer different
# questions. A push that changes the source strings tells Crowdin what there is to translate,
# and that has to happen while the change is still fresh. Translations arrive whenever a
# translator gets to them, which no push can predict, so the download runs on a schedule and
# opens a pull request with whatever changed - the one part of this that needs a person.
#
# Nothing here can push a translation into the tree on its own, which is deliberate: a locale
# folder in this repository is a claim that the language is translated, and that claim is worth
# a look before it is made.
on:
  push:
    branches: [master]
    paths:
      - manager/src/main/res/values/strings.xml
      - crowdin.yml
      - .github/workflows/crowdin.yml
  schedule:
    # Nightly. Nothing here is urgent, and every language costs hosted words on the free plan.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seed_translations:
        description: >-
          Also upload this repository's own translation files to Crowdin. For a language the
          project does not have yet, whose folder this app already carries.
        type: boolean
        default: false

jobs:
  upload:
    if: github.event_name == 'push' || inputs.seed_translations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Send the source strings
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          project_id: 935085
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          upload_sources: true
          # The repository is not where translations are written, so this is off for an
          # ordinary run. It is turned on by hand for a language the project does not have
          # yet, where the app's own folder is the only copy of that language anywhere: the
          # files named by the translation pattern are read back in as its translations.
          upload_translations: ${{ inputs.seed_translations }}
          download_translations: false
          create_pull_request: false

  download:
    # Not on a seeding run: that run exists to push a language up, and pulling straight back
    # down in the same breath would only race the import it just asked for.
    if: github.event_name != 'push' && !inputs.seed_translations
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Bring back whatever has been translated
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          project_id: 935085
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          # Belt and braces on the project setting of the same name: without it Crowdin writes
          # the source text into a language with no translation of its own, which is how ~200
          # English copies ended up in this repository looking translated.
          skip_untranslated_strings: true
          download_translations: true
          upload_sources: false
          # Deliberately not Crowdin's own branch name, so this and the GitHub integration in
          # the Crowdin project cannot both write the same one.
          localization_branch_name: l10n
          push_translations: true
          create_pull_request: true
          pull_request_base_branch_name: master
          pull_request_title: 'chore(i18n): new translations from Crowdin'
          pull_request_body: >-
            Translations that arrived in Crowdin since the last sync. Only
            `manager/src/main/res/values-*/strings.xml` changes, and the merge is automatic
            once that is all it is.
          commit_message: 'chore(i18n): new translations from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge:
    # In the same workflow as the pull request it merges, and not in a workflow of its own
    # reacting to the pull request event: GitHub does not start runs for events caused by
    # GITHUB_TOKEN, so a pull request opened by the step above can never trigger one. It sat
    # open forever while a separate workflow waited for an event that was never coming.
    needs: download
    if: github.event_name != 'push' && !inputs.seed_translations
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find the pull request the download opened
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number=$(gh pr list --head l10n --state open --json number -q '.[0].number')
          if [ -z "$number" ]; then
            echo "nothing to merge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh pr diff "$number" --name-only | sed '/^$/d' > changed.txt
          git fetch --depth=1 origin l10n

      # A translation that changes a placeholder or an ADB command is left open by the check
      # below, so the next sync would download the same bad value again. Remove only those
      # rejected elements from the branch and delete their translations from Crowdin first.
      # The app then falls back to the English string, and the next export cannot bring the
      # bad value back. The token is only used for this clean-up; it never reaches a log.
      - name: Remove translations the check refuses
        if: steps.pr.outputs.skip != 'true'
        env:
          CROWDIN_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          CROWDIN_PROJECT_ID: '935085'
        run: |
          set -euo pipefail

          git checkout -B l10n origin/l10n
          python3 ci/repair-translations.py changed.txt origin/l10n origin/master

          if git diff --quiet; then
            echo "the export has no translation the check refuses"
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -am 'fix(i18n): remove translations the check refuses'
          git push origin l10n
          git fetch --depth=1 origin l10n

      # The export writes what the translator typed, and a translator is not thinking about the
      # resource compiler: an Italian sentence arrives holding `nell'app`, aapt2 refuses a bare
      # apostrophe wherever it is not inside a quoted region, and master's Build App goes red on a
      # translation nobody can compile. Escaping it in the repository does not hold - the next
      # export writes the translator's text again - so it is escaped here, on the branch the
      # download pushed, before the check that would otherwise refuse it.
      #
      # Here rather than in the download job, where it was first written, because the fetch of the
      # branch the export had just pushed failed there and the step reported "nothing to repair" -
      # with that fetch's error sent to /dev/null, which is why the cause is still open. A shallow
      # clone is not it: fetching a branch that has just been pushed into one works, measured. What
      # is known is that this job fetches the same branch successfully a few steps above, and that
      # the repair has to happen before the check below rather than after it.
      - name: Escape the apostrophes the export cannot carry
        if: steps.pr.outputs.skip != 'true'
        run: |
          set -euo pipefail

          # No swallowing of a fetch failure here: if the branch cannot be read, the repair cannot
          # be made, and the step has to say so rather than let the check below report it as a bad
          # translation.
          git checkout -B l10n origin/l10n
          python3 ci/translation_escapes.py

          if git diff --quiet; then
            echo "the export carried no apostrophe the compiler refuses"
            exit 0
          fi

          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -am 'fix(i18n): escape the apostrophes the resource compiler refuses'
          git push origin l10n

          # The check reads the branch out of git rather than out of this working tree, so the
          # fetch that found it has to see what this step pushed.
          git fetch --depth=1 origin l10n

      - name: Check it before merging it
        if: steps.pr.outputs.skip != 'true'
        run: python3 ci/check-translations.py changed.txt origin/l10n origin/master

      - name: Merge it
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number=${{ steps.pr.outputs.number }}

          # The step above pushes to this branch when there is an apostrophe to escape, and GitHub
          # decides whether a pull request can be merged asynchronously. Reading `mergeable` can
          # still answer MERGEABLE from before that push, and the merge itself is then refused
          # with "Pull Request is not mergeable". So the merge is what is retried here, not only
          # the state that precedes it. A refusal for any other reason is reported and stops at
          # once rather than being retried.
          for attempt in $(seq 1 12); do
            state=$(gh pr view "$number" --json state,mergeable \
              -q '.state + " " + (.mergeable // "UNKNOWN")')

            case "$state" in
              "MERGED "*) echo "already merged"; exit 0 ;;
              "OPEN MERGEABLE")
                if gh pr merge "$number" \
                    --squash --delete-branch \
                    --subject 'chore(i18n): new translations from Crowdin' \
                    --body 'Merged automatically: only translated strings.xml files changed.' \
                    2>merge.err; then
                  exit 0
                fi
                if grep -qi 'not mergeable' merge.err; then
                  echo "mergeable said yes, the merge was refused; waiting"
                else
                  cat merge.err >&2
                  exit 1
                fi
                ;;
              *)
                echo "state is $state, waiting"
                ;;
            esac

            sleep 5
          done

          echo "::error::could not merge pull request $number"
          gh pr view "$number" --json state,mergeable,mergeStateStatus
          exit 1
