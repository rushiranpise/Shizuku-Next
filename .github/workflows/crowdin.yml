name: Translations

# Two halves of one job, and they run on different days, because they answer different
# questions. A push that changes the source strings tells Crowdin what there is to translate,
# and that has to happen while the change is still fresh. Translations arrive whenever a
# translator gets to them, which no push can predict, so the download runs on a schedule and
# opens a pull request with whatever changed - the one part of this that needs a person.
#
# Nothing here can push a translation into the tree on its own, which is deliberate: a locale
# folder in this repository is a claim that the language is translated, and that claim is worth
# a look before it is made.
on:
  push:
    branches: [master]
    paths:
      - manager/src/main/res/values/strings.xml
      - crowdin.yml
      - .github/workflows/crowdin.yml
  schedule:
    # Nightly. Nothing here is urgent, and every language costs hosted words on the free plan.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      seed_translations:
        description: >-
          Also upload this repository's own translation files to Crowdin. For a language the
          project does not have yet, whose folder this app already carries.
        type: boolean
        default: false

jobs:
  upload:
    if: github.event_name == 'push' || inputs.seed_translations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Send the source strings
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          project_id: 935085
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          upload_sources: true
          # The repository is not where translations are written, so this is off for an
          # ordinary run. It is turned on by hand for a language the project does not have
          # yet, where the app's own folder is the only copy of that language anywhere: the
          # files named by the translation pattern are read back in as its translations.
          upload_translations: ${{ inputs.seed_translations }}
          download_translations: false
          create_pull_request: false

  download:
    # Not on a seeding run: that run exists to push a language up, and pulling straight back
    # down in the same breath would only race the import it just asked for.
    if: github.event_name != 'push' && !inputs.seed_translations
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Bring back whatever has been translated
        uses: crowdin/github-action@v3
        with:
          config: crowdin.yml
          project_id: 935085
          token: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}
          # Belt and braces on the project setting of the same name: without it Crowdin writes
          # the source text into a language with no translation of its own, which is how ~200
          # English copies ended up in this repository looking translated.
          skip_untranslated_strings: true
          download_translations: true
          upload_sources: false
          # Deliberately not Crowdin's own branch name, so this and the GitHub integration in
          # the Crowdin project cannot both write the same one.
          localization_branch_name: l10n
          push_translations: true
          create_pull_request: true
          pull_request_base_branch_name: master
          pull_request_title: 'chore(i18n): new translations from Crowdin'
          pull_request_body: >-
            Translations that arrived in Crowdin since the last sync. Only
            `manager/src/main/res/values-*/strings.xml` changes, and the merge is automatic
            once that is all it is.
          commit_message: 'chore(i18n): new translations from Crowdin'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  merge:
    # In the same workflow as the pull request it merges, and not in a workflow of its own
    # reacting to the pull request event: GitHub does not start runs for events caused by
    # GITHUB_TOKEN, so a pull request opened by the step above can never trigger one. It sat
    # open forever while a separate workflow waited for an event that was never coming.
    needs: download
    if: github.event_name != 'push' && !inputs.seed_translations
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Find the pull request the download opened
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          number=$(gh pr list --head l10n --state open --json number -q '.[0].number')
          if [ -z "$number" ]; then
            echo "nothing to merge"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          gh pr diff "$number" --name-only | sed '/^$/d' > changed.txt
          git fetch --depth=1 origin l10n

      - name: Check it before merging it
        if: steps.pr.outputs.skip != 'true'
        run: python3 ci/check-translations.py changed.txt origin/l10n origin/master

      - name: Merge it
        if: steps.pr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr merge ${{ steps.pr.outputs.number }} \
            --squash --delete-branch \
            --subject 'chore(i18n): new translations from Crowdin' \
            --body 'Merged automatically: only translated strings.xml files changed.'
